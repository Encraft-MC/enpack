name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve published artifacts
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changes="$(git diff --no-renames --name-only --diff-filter=MDT "$BASE_SHA" HEAD -- artifacts/)"
          if [ -n "$changes" ]; then
            echo "Published artifacts cannot be replaced or removed; add a new version."
            echo "$changes"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_pack.py --download
